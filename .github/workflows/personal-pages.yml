name: Publicar Control de Personal MAHEBEER

on:
  push:
    branches: [main]
    paths:
      - 'personal/**'
      - '.github/workflows/personal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: './personal'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
