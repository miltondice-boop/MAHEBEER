<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHEBEER - Control de Personal</title><style>html,body{margin:0;height:100%;background:#0b0e11;color:#fff;font-family:Arial,sans-serif}#loading{display:grid;place-items:center;height:100%;font-weight:700}.weekly-pay{margin:0 0 15px;padding:18px;background:linear-gradient(180deg,#171c22,#12161b);border:1px solid #303842;border-radius:16px}.weekly-pay h2{margin:0 0 6px}.weekly-sub{color:#9ba5b1;margin-bottom:14px}.weekly-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.weekly-card{background:#1c2229;border:1px solid #303842;border-radius:13px;padding:14px}.weekly-card .wn{font-size:17px;font-weight:800}.weekly-card .wh{font-size:25px;font-weight:900;margin:7px 0}.weekly-card .wd{color:#9ba5b1;font-size:12px}.weekly-card button{margin-top:10px;width:100%;border:0;border-radius:9px;padding:12px;font-weight:900;cursor:pointer;background:#f5b942;color:#111}.weekly-card button:disabled{opacity:.5;cursor:default}.employee-only-clock{text-align:center!important;padding:28px 12px 35px!important}.employee-only-clock h2{font-size:24px;margin:0 0 8px}.employee-only-clock .sub{color:#9ba5b1;margin-bottom:24px}.employee-round{width:220px;height:220px;border-radius:50%;border:7px solid #20a66a;background:radial-gradient(circle,#2a3036,#11151a 70%);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;box-shadow:0 0 35px #0008;cursor:pointer;transition:.2s}.employee-round:hover{transform:scale(1.03)}.employee-round.out{border-color:#d04a45;background:radial-gradient(circle,#352426,#11151a 70%)}.employee-round:disabled{opacity:.7;cursor:wait}.employee-round .ico{font-size:48px}.employee-round .txt{font-size:20px;font-weight:900}.employee-greeting{min-height:30px;margin-top:20px;font-size:22px;font-weight:800;color:#f5b942}.employee-greeting.rest{color:#65e3b0}@media(max-width:600px){.weekly-grid{grid-template-columns:1fr}.employee-round{width:190px;height:190px}}</style></head><body><div id="loading">Cargando MAHEBEER...</div><script>
const BASE='https://raw.githubusercontent.com/miltondice-boop/MAHEBEER/4186f422baeb053df3260287250a23aeea951df5/personal/index.html';
fetch(BASE+'?v=20260821-0932').then(r=>{if(!r.ok)throw new Error('No se pudo cargar la versión base');return r.text()}).then(html=>{
const code=`(function(){
let idleTimer=null,lastActivity=Date.now(),employeeBuilt=false,weeklyBuilt=false;
const touch=()=>{lastActivity=Date.now()};
['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(e=>document.addEventListener(e,touch,{passive:true}));
function employee(){return typeof profile!=='undefined'&&profile&&profile.rol!=='administrador'}
function admin(){return typeof profile!=='undefined'&&profile&&profile.rol==='administrador'}
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(v||0))}
async function logoutIdle(){clearInterval(idleTimer);try{await db.auth.signOut()}catch(e){}alert('Tu sesión se cerró por 5 minutos de inactividad. Debes ingresar nuevamente.');location.reload()}
function startIdle(){if(idleTimer)return;lastActivity=Date.now();idleTimer=setInterval(()=>{if(typeof profile!=='undefined'&&profile&&Date.now()-lastActivity>=300000)logoutIdle()},1000)}
function greeting(text,rest){const g=document.getElementById('employeeGreeting');if(!g)return;g.className='employee-greeting '+(rest?'rest':'');g.textContent=text;clearTimeout(window._maheGreeting);window._maheGreeting=setTimeout(()=>g.textContent='',5000)}
function buttonState(){const b=document.getElementById('employeeRound');if(!b||!Array.isArray(journeys))return;const open=journeys.some(j=>!j.salida);b.classList.toggle('out',open);b.querySelector('.ico').textContent=open?'⏹️':'▶️';b.querySelector('.txt').textContent=open?'REGISTRAR SALIDA':'REGISTRAR ENTRADA'}
function buildEmployee(){if(!employee()||employeeBuilt)return;const area=document.getElementById('employeeArea');if(!area)return;employeeBuilt=true;document.querySelector('.stats')?.classList.add('hidden');document.getElementById('adminArea')?.classList.add('hidden');document.getElementById('movementCard')?.classList.add('hidden');document.querySelectorAll('#app>.card.full').forEach(x=>x.classList.add('hidden'));area.className='card employee-only-clock';area.innerHTML='<h2>Mi jornada</h2><div class="sub">Registra tu entrada o salida</div><button id="employeeRound" class="employee-round" type="button"><span class="ico">▶️</span><span class="txt">REGISTRAR ENTRADA</span></button><div id="employeeGreeting" class="employee-greeting" aria-live="polite"></div>';buttonState();document.getElementById('employeeRound').onclick=async()=>{const e=employees&&employees[0];if(!e)return;const open=Array.isArray(journeys)&&journeys.some(j=>!j.salida);const b=document.getElementById('employeeRound');b.disabled=true;const r=await db.rpc('registrar_movimiento_personal',{p_empleado_id:e.id,p_tipo:open?'SALIDA':'ENTRADA',p_observacion:null});if(r.error){greeting('No se pudo registrar el movimiento.',true);b.disabled=false;return}greeting(open?'¡Feliz descanso! 😴':'¡Feliz turno! 👋',open);touch();await loadAll();buttonState();b.disabled=false};}
async function weeklySummary(id){const r=await db.rpc('resumen_pago_semanal',{p_empleado_id:id});if(r.error)throw r.error;return r.data&&r.data[0]?r.data[0]:null}
async function refreshWeekly(){const grid=document.getElementById('weeklyGrid');if(!grid||!admin())return;grid.innerHTML='';for(const e of employees||[]){const c=document.createElement('div');c.className='weekly-card';try{const s=await weeklySummary(e.id);const h=Number(s&&s.horas||0),t=Number(s&&s.total||0);c.innerHTML='<div class="wn">'+esc(e.nombre_completo)+'</div><div class="wd">Periodo: '+esc(s&&s.periodo_inicio||'')+' → '+esc(s&&s.periodo_fin||'')+'</div><div class="wh">'+h.toFixed(2)+' horas</div><div class="wh">'+money(t)+'</div><button '+(h<=0?'disabled':'')+'>PAGADO ✓</button>';const btn=c.querySelector('button');if(btn)btn.onclick=async()=>{const fresh=await weeklySummary(e.id);const fh=Number(fresh&&fresh.horas||0),ft=Number(fresh&&fresh.total||0);if(fh<=0){alert('No hay horas pendientes de pago para '+e.nombre_completo+'.');return}const ok=confirm(['¿Marcar como PAGADO a '+e.nombre_completo+'?','', 'Horas: '+fh.toFixed(2),'Total: '+money(ft),'','Al confirmar, este periodo queda cerrado y el nuevo conteo comienza desde cero.'].join(String.fromCharCode(10)));if(!ok)return;const r=await db.rpc('pagar_semana_empleado',{p_empleado_id:e.id,p_observacion:'Pago semanal'});if(r.error){alert('No se pudo registrar el pago: '+r.error.message);return}alert('Pago registrado correctamente. El nuevo conteo comenzó.');await loadAll();await refreshWeekly()}}catch(err){c.innerHTML='<div class="wn">'+esc(e.nombre_completo)+'</div><div class="wd">No se pudo calcular el pago semanal.</div>'}grid.appendChild(c)}if(!(employees&&employees.length))grid.innerHTML='<div class="weekly-sub">No hay empleados activos.</div>'}
function buildWeekly(){if(!admin()||weeklyBuilt)return;const target=document.getElementById('adminArea');if(!target)return;weeklyBuilt=true;const box=document.createElement('section');box.className='weekly-pay';box.id='weeklyPay';box.innerHTML='<h2>💰 Pago semanal</h2><div class="weekly-sub">Horas acumuladas y total a pagar. <b>PAGADO</b> cierra el periodo sin borrar el histórico y comienza un nuevo conteo.</div><div id="weeklyGrid" class="weekly-grid"><div class="weekly-sub">Calculando...</div></div>';target.parentNode.insertBefore(box,target);refreshWeekly()}
function tick(){if(typeof profile==='undefined'||!profile)return;startIdle();if(employee())buildEmployee();if(admin())buildWeekly();buttonState()}
const oldLoad=typeof loadAll==='function'?loadAll:null;if(oldLoad){window.loadAll=async function(){const r=await oldLoad.apply(this,arguments);setTimeout(()=>{tick();if(admin())refreshWeekly()},100);return r}}
const waiter=setInterval(()=>{if(typeof profile!=='undefined'&&profile){clearInterval(waiter);tick();}},250);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')touch()});
})();`;
const tag='<scr'+'ipt>'+code+'<'+'/scr'+'ipt>';
html=html.replace('</head>','<style id="mahebeer-feature-style">'+document.querySelector('style')?.textContent+'</style></head>').replace('</body>',tag+'</body>');
document.open();document.write(html);document.close();
}).catch(e=>{document.getElementById('loading').textContent='No se pudo cargar el Control de Personal: '+e.message});
</script></body></html>
