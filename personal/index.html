<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHEBEER - Control de Personal</title><style>html,body{margin:0;height:100%;background:#0b0e11;color:#fff;font-family:Arial,sans-serif}#loading{display:grid;place-items:center;height:100%;font-weight:700}.weekly-pay{margin:0 0 15px;padding:18px;background:linear-gradient(180deg,#171c22,#12161b);border:1px solid #303842;border-radius:16px}.weekly-pay h2{margin:0 0 5px}.weekly-sub{color:#9ba5b1;margin-bottom:14px}.weekly-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.weekly-card{background:#1c2229;border:1px solid #303842;border-radius:13px;padding:14px}.weekly-card .wn{font-size:17px;font-weight:800}.weekly-card .wh{font-size:25px;font-weight:900;margin:7px 0}.weekly-card .wd{color:#9ba5b1;font-size:12px}.weekly-card button{margin-top:10px;width:100%;border:0;border-radius:9px;padding:11px;font-weight:900;cursor:pointer;background:#f5b942;color:#111}.weekly-card button:hover{filter:brightness(1.08)}.weekly-card button:disabled{opacity:.55;cursor:default}.weekly-paid{color:#65e3b0;font-weight:800}.weekly-empty{color:#9ba5b1;padding:8px 0}@media(max-width:600px){.weekly-grid{grid-template-columns:1fr}}</style></head><body><div id="loading">Cargando MAHEBEER...</div><script>
const BASE='https://raw.githubusercontent.com/miltondice-boop/MAHEBEER/4186f422baeb053df3260287250a23aeea951df5/personal/index.html';
fetch(BASE).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la versión base');return r.text()}).then(html=>{
const patch=`<style id="employee-patch">.employee-only-clock{text-align:center!important;padding:28px 12px 35px!important}.employee-only-clock h2{font-size:24px;margin:0 0 8px}.employee-only-clock .sub{color:#9ba5b1;margin-bottom:24px}.employee-round{width:220px;height:220px;border-radius:50%;border:7px solid #20a66a;background:radial-gradient(circle,#2a3036,#11151a 70%);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;box-shadow:0 0 35px #0008;cursor:pointer;transition:.2s}.employee-round:hover{transform:scale(1.03)}.employee-round.out{border-color:#d04a45;background:radial-gradient(circle,#352426,#11151a 70%)}.employee-round .ico{font-size:48px}.employee-round .txt{font-size:20px;font-weight:900}.employee-greeting{margin-top:20px;font-size:22px;font-weight:800;color:#f5b942}.employee-greeting.rest{color:#65e3b0}</style>`;
const script=`<script>(function(){let lastActivity=Date.now(),idleTimer=null,employeeReady=false,adminWeeklyReady=false;function touch(){lastActivity=Date.now()}['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(e=>document.addEventListener(e,touch,{passive:true}));async function forceLogout(){clearInterval(idleTimer);try{await db.auth.signOut()}catch(e){}alert('Tu sesión se cerró por 5 minutos de inactividad. Debes ingresar nuevamente.');location.reload()}function startInactivity(){if(idleTimer)return;lastActivity=Date.now();idleTimer=setInterval(()=>{if(typeof profile!=='undefined'&&profile&&profile.rol!=='administrador'&&Date.now()-lastActivity>=300000)forceLogout()},1000)}function isEmployee(){return typeof profile!=='undefined'&&profile&&profile.rol!=='administrador'}function isAdmin(){return typeof profile!=='undefined'&&profile&&profile.rol==='administrador'}function showGreeting(text,rest){const g=document.getElementById('employeeGreeting');if(!g)return;g.className='employee-greeting '+(rest?'rest':'');g.textContent=text;clearTimeout(window._greetTimer);window._greetTimer=setTimeout(()=>{g.textContent=''},5000)}function updateButton(){const b=document.getElementById('employeeRound');if(!b||!Array.isArray(journeys))return;const open=journeys.find(j=>!j.salida);b.classList.toggle('out',!!open);b.querySelector('.ico').textContent=open?'⏹️':'▶️';b.querySelector('.txt').textContent=open?'REGISTRAR SALIDA':'REGISTRAR ENTRADA'}function buildEmployee(){if(!isEmployee()||employeeReady)return;if(!document.getElementById('employeeArea'))return;employeeReady=true;document.querySelector('.stats')?.classList.add('hidden');document.getElementById('adminArea')?.classList.add('hidden');document.getElementById('movementCard')?.classList.add('hidden');document.querySelectorAll('#app>.card.full').forEach(c=>c.classList.add('hidden'));const area=document.getElementById('employeeArea');area.className='card employee-only-clock';area.innerHTML='<h2>Mi jornada</h2><div class="sub">Registra tu entrada o salida</div><button id="employeeRound" class="employee-round" type="button"><span class="ico">▶️</span><span class="txt">REGISTRAR ENTRADA</span></button><div id="employeeGreeting" aria-live="polite"></div>';updateButton();document.getElementById('employeeRound').onclick=async()=>{if(!employees||!employees[0])return;const goingOut=Array.isArray(journeys)&&journeys.find(j=>!j.salida);const id=employees[0].id;const b=document.getElementById('employeeRound');if(b)b.disabled=true;const r=await db.rpc('registrar_movimiento_personal',{p_empleado_id:id,p_tipo:goingOut?'SALIDA':'ENTRADA',p_observacion:null});if(r.error){showGreeting('No se pudo registrar: '+r.error.message,true);if(b)b.disabled=false;return}showGreeting(goingOut?'¡Feliz descanso! 😴':'¡Feliz turno! 👋',goingOut);await loadAll();updateButton();touch();if(b)b.disabled=false};startInactivity()}async function weeklySummary(id){const r=await db.rpc('resumen_pago_semanal',{p_empleado_id:id});if(r.error)throw r.error;return r.data?.[0]||null}async function renderWeekly(){if(!isAdmin()||adminWeeklyReady)return;const admin=document.getElementById('adminArea');if(!admin)return;adminWeeklyReady=true;const box=document.createElement('section');box.className='weekly-pay';box.id='weeklyPay';box.innerHTML='<h2>💰 Pago semanal</h2><div class="weekly-sub">Aquí ves las horas y cuánto debes pagar. Al tocar <b>PAGADO</b>, esas horas quedan cerradas y el siguiente conteo comienza de nuevo.</div><div id="weeklyGrid" class="weekly-grid"><div class="weekly-empty">Calculando...</div></div>';admin.parentNode.insertBefore(box,admin);await refreshWeekly()}async function refreshWeekly(){const grid=document.getElementById('weeklyGrid');if(!grid||!isAdmin())return;grid.innerHTML='';for(const e of employees||[]){try{const s=await weeklySummary(e.id);const h=Number(s?.horas||0),total=Number(s?.total||0),inicio=s?.periodo_inicio||new Date().toISOString().slice(0,10),fin=s?.periodo_fin||new Date().toISOString().slice(0,10);const c=document.createElement('div');c.className='weekly-card';c.innerHTML='<div class="wn">'+escapeHtml(e.nombre_completo)+'</div><div class="wd">Período: '+inicio+' → '+fin+'</div><div class="wh">'+h.toFixed(2)+' horas</div><div class="wh">'+new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(total)+'</div><button '+(h<=0?'disabled':'')+' data-id="'+e.id+'">PAGADO ✓</button>';c.querySelector('button').onclick=()=>markPaid(e.id,e.nombre_completo);grid.appendChild(c)}catch(err){const c=document.createElement('div');c.className='weekly-card';c.innerHTML='<div class="wn">'+escapeHtml(e.nombre_completo)+'</div><div class="weekly-empty">No se pudo calcular: '+escapeHtml(err.message||String(err))+'</div>';grid.appendChild(c)}}if(!employees?.length)grid.innerHTML='<div class="weekly-empty">No hay empleados activos.</div>'}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function markPaid(id,name){const s=await weeklySummary(id);if(!s||Number(s.horas||0)<=0){alert('No hay horas pendientes de pago para '+name+'.');return}const total=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(s.total||0));if(!confirm('¿Marcar como PAGADO a '+name+'?\n\nHoras: '+Number(s.horas||0).toFixed(2)+'\nTotal: '+total+'\n\nAl confirmar, este período queda cerrado y el nuevo conteo comienza desde cero.'))return;const r=await db.rpc('pagar_semana_empleado',{p_empleado_id:id,p_observacion:'Pago semanal'});if(r.error){alert('No se pudo registrar el pago: '+r.error.message);return}alert('Pago registrado correctamente. El conteo de '+name+' comenzó nuevamente.');await loadAll();await refreshWeekly()}function waitForReady(){if(isEmployee()){buildEmployee();return}if(isAdmin()){if(typeof employees!=='undefined'&&Array.isArray(employees)&&employees.length)renderWeekly();else setTimeout(waitForReady,250);return}setTimeout(waitForReady,250)}setTimeout(waitForReady,500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')touch()});})();<\/script>`;
html=html.replace('</head>',patch+'</head>').replace('</body>',script+'</body>');document.open();document.write(html);document.close();}).catch(e=>{document.getElementById('loading').textContent='No se pudo cargar el Control de Personal: '+e.message});</script></body></html>
