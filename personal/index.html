<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHEBEER - Control de Personal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d0f12;color:#f5f5f5;font:14px Arial;padding:20px}.box{max-width:900px;margin:30px auto;background:#171b20;border:1px solid #303640;border-radius:16px;padding:20px}input,button{box-sizing:border-box;border-radius:9px;border:1px solid #303640;padding:11px}input{background:#0e1115;color:white;width:100%}button{cursor:pointer;background:#2a3038;color:white;font-weight:bold}.gold{background:#f5b942;color:#111}.red{background:#a73e3b}.green{background:#16845e}.pass{display:flex;gap:6px}.pass input{flex:1}.eye{width:52px}.msg{margin-top:10px;padding:10px;border-radius:9px;background:#4a2020;color:#ffaaa6}.ok{background:#123f31;color:#65e3b0}.hidden{display:none!important}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.person{display:flex;justify-content:space-between;gap:10px;padding:12px;margin:8px 0;background:#20252b;border-radius:10px}.actions{display:flex;gap:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:650px){.grid,.row{grid-template-columns:1fr}.person{flex-direction:column}.actions button{flex:1}}</style></head><body><div id="login" class="box" style="max-width:430px"><h1>MAHEBEER</h1><p>Control de Personal</p><h2>Iniciar sesión</h2><input id="u" autocomplete="username" placeholder="Usuario o correo"><br><br><div class="pass"><input id="p" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="eye" class="eye" type="button">👁️</button></div><br><button id="enter" class="gold" style="width:100%">Entrar</button><div id="lm"></div><p style="color:#9ba5b1;font-size:12px">Administrador: miltondice</p></div><main id="app" class="box hidden"><div class="head"><div><h1>MAHEBEER</h1><p>Control de Personal</p></div><div><b id="who"></b> <button id="exit">Salir</button></div></div><hr><div class="grid"><section><h2>Personal</h2><div id="people"></div></section><section id="admin" class="hidden"><h2>Agregar empleado</h2><div class="row"><input id="n" placeholder="Nombre completo"><input id="r" placeholder="Cargo"></div><br><div class="row"><input id="ph" placeholder="Teléfono"><input id="doc" placeholder="Documento"></div><br><input id="usr" placeholder="Usuario"><br><br><div class="pass"><input id="pw" type="password" placeholder="Contraseña mínimo 6"><button type="button" class="eye" data-eye="pw">👁️</button></div><br><button id="create" class="gold">Crear empleado y acceso</button><div id="am"></div></section></div></main><script>const SB_URL='https://gkuwjfmgdmlyqgmvdmzf.supabase.co';const SB_KEY='sb_publishable_BNIDfWmXGt6QUNIMqdt2LQ_HxxEZXDA';const db=supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id);function msg(id,text,ok){$(id).className='msg '+(ok?'ok':'');$(id).textContent=text||''}function eye(id,b){const x=$(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'👁️':'🙈'}$('eye').onclick=()=>eye('p',$('eye'));document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>eye(b.dataset.eye,b));async function login(){msg('lm','');const user=$('u').value.trim(),pass=$('p').value;if(!user||!pass)return msg('lm','Escribe usuario y contraseña.');try{let res;if(user.includes('@'))res=await db.auth.signInWithPassword({email:user,password:pass});else res=await db.functions.invoke('login-usuario',{body:{usuario:user,password:pass}});if(res.error)return msg('lm',res.error.message||'Usuario o contraseña incorrectos.');if(!user.includes('@')){if(!res.data||!res.data.session)return msg('lm','No se recibió una sesión válida.');const s=await db.auth.setSession(res.data.session);if(s.error)return msg('lm','No se pudo establecer la sesión: '+s.error.message)}await openApp()}catch(e){msg('lm','Error al conectar con Supabase: '+(e.message||e))}}$('enter').onclick=login;['u','p'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));async function openApp(){const g=await db.auth.getUser();if(g.error||!g.data.user)return msg('lm','Sesión no válida.');const q=await db.from('perfiles').select('*').eq('id',g.data.user.id).maybeSingle();if(q.error)return msg('lm','No se pudo cargar el perfil: '+q.error.message);if(!q.data)return msg('lm','La cuenta no tiene perfil.');$('who').textContent=(q.data.nombre||g.data.user.email)+' · '+q.data.rol;$('login').classList.add('hidden');$('app').classList.remove('hidden');if(q.data.rol==='administrador')$('admin').classList.remove('hidden');window.profile=q.data;await load()}$('exit').onclick=async()=>{await db.auth.signOut();location.reload()};async function load(){const q=await db.from('empleados').select('*').eq('activo',true).order('nombre_completo');if(q.error)return msg('am','No se pudieron cargar empleados: '+q.error.message);const box=$('people');box.innerHTML='';q.data.forEach(e=>{const d=document.createElement('div');d.className='person';d.innerHTML='<div><b>'+safe(e.nombre_completo)+'</b><br><small>'+safe(e.cargo||'Personal')+(e.usuario?' · 👤 '+safe(e.usuario):' · ⚠ Sin acceso')+'</small></div><div class="actions"><button class="green" data-in="'+e.id+'">Entrada</button><button class="red" data-out="'+e.id+'">Salida</button>'+(window.profile.rol==='administrador'?'<button data-edit="'+e.id+'">Editar</button>':'')+'</div>';box.appendChild(d)});box.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>move(b.dataset.in,'ENTRADA'));box.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>move(b.dataset.out,'SALIDA'));box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit,q.data))}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function move(id,type){const r=await db.rpc('registrar_movimiento_admin',{p_empleado_id:id,p_tipo:type,p_observacion:null});if(r.error)return msg('am',r.error.message);msg('am','Movimiento registrado.',true);await load()}async function admin(body){const r=await db.functions.invoke('admin-empleado',{body});if(r.error)throw new Error(r.error.message||'Error en admin-empleado');if(r.data&&r.data.error)throw new Error(r.data.error);return r.data}$('create').onclick=async()=>{const body={action:'create',nombre_completo:$('n').value.trim(),cargo:$('r').value.trim()||'Personal',telefono:$('ph').value.trim(),documento:$('doc').value.trim(),usuario:$('usr').value.trim().toLowerCase(),password:$('pw').value};if(!body.nombre_completo||!body.usuario||body.password.length<6)return msg('am','Nombre, usuario y contraseña de mínimo 6 caracteres son obligatorios.');try{await admin(body);msg('am','Empleado y acceso creados correctamente.',true);['n','r','ph','doc','usr','pw'].forEach(x=>$(x).value='');await load()}catch(e){msg('am',e.message)}};async function edit(id,list){const e=list.find(x=>x.id===id);const n=prompt('Nombre completo:',e.nombre_completo||'');if(n===null)return;const r=prompt('Cargo:',e.cargo||'');if(r===null)return;const u=prompt('Usuario:',e.usuario||'');if(u===null)return;const pw=prompt('Nueva contraseña (deja vacío para conservar):','');try{await admin({action:'update',id,nombre_completo:n,cargo:r,telefono:e.telefono||'',documento:e.documento||'',usuario:u.trim().toLowerCase(),password:pw||null});alert('Empleado actualizado correctamente.');await load()}catch(x){alert(x.message)}}db.auth.getSession().then(x=>{if(x.data.session)openApp()});</script></body></html>
