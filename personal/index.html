<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHEBEER - Control de Personal</title><style>html,body{margin:0;height:100%;background:#0b0e11;color:#fff;font-family:Arial,sans-serif}#loading{display:grid;place-items:center;height:100%;font-weight:700}</style></head><body><div id="loading">Cargando MAHEBEER...</div><script>
const BASE='https://raw.githubusercontent.com/miltondice-boop/MAHEBEER/4186f422baeb053df3260287250a23aeea951df5/personal/index.html';
fetch(BASE).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la versión base');return r.text()}).then(html=>{
const patch=`<style id="employee-patch">.employee-only-clock{text-align:center!important;padding:28px 12px 35px!important}.employee-only-clock h2{font-size:24px;margin:0 0 8px}.employee-only-clock .sub{color:#9ba5b1;margin-bottom:24px}.employee-round{width:220px;height:220px;border-radius:50%;border:7px solid #f5b942;background:radial-gradient(circle,#2a3036,#11151a 70%);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;box-shadow:0 0 35px #0008;cursor:pointer;transition:.2s}.employee-round:hover{transform:scale(1.03)}.employee-round.out{border-color:#a73e3b}.employee-round .ico{font-size:48px}.employee-round .txt{font-size:20px;font-weight:900}.employee-greeting{margin-top:20px;font-size:22px;font-weight:800;color:#f5b942}.employee-greeting.rest{color:#65e3b0}</style>`;
const script=`<script>(function(){let lastActivity=Date.now(),idleTimer=null,employeeReady=false;function touch(){lastActivity=Date.now()}['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(e=>document.addEventListener(e,touch,{passive:true}));async function forceLogout(){clearInterval(idleTimer);try{await db.auth.signOut()}catch(e){}alert('Tu sesión se cerró por 5 minutos de inactividad. Debes ingresar nuevamente.');location.reload()}function startInactivity(){if(idleTimer)return;lastActivity=Date.now();idleTimer=setInterval(()=>{if(typeof profile!=='undefined'&&profile&&profile.rol!=='administrador'&&Date.now()-lastActivity>=300000)forceLogout()},1000)}function isEmployee(){return typeof profile!=='undefined'&&profile&&profile.rol!=='administrador'}function showGreeting(text,rest){const g=document.getElementById('employeeGreeting');if(!g)return;g.className='employee-greeting '+(rest?'rest':'');g.textContent=text;clearTimeout(window._greetTimer);window._greetTimer=setTimeout(()=>{g.textContent=''},5000)}function updateButton(){const b=document.getElementById('employeeRound');if(!b||!Array.isArray(journeys))return;const open=journeys.find(j=>!j.salida);b.classList.toggle('out',!!open);b.querySelector('.ico').textContent=open?'⏹️':'▶️';b.querySelector('.txt').textContent=open?'REGISTRAR SALIDA':'REGISTRAR ENTRADA'}function buildEmployee(){if(!isEmployee()||employeeReady)return;if(!document.getElementById('employeeArea'))return;employeeReady=true;document.querySelector('.stats')?.classList.add('hidden');document.getElementById('adminArea')?.classList.add('hidden');document.getElementById('movementCard')?.classList.add('hidden');document.querySelectorAll('#app>.card.full').forEach(c=>c.classList.add('hidden'));const area=document.getElementById('employeeArea');area.className='card employee-only-clock';area.innerHTML='<h2>Mi jornada</h2><div class="sub">Registra tu entrada o salida</div><button id="employeeRound" class="employee-round" type="button"><span class="ico">▶️</span><span class="txt">REGISTRAR ENTRADA</span></button><div id="employeeGreeting" aria-live="polite"></div>';updateButton();document.getElementById('employeeRound').onclick=async()=>{if(!employees||!employees[0])return;const goingOut=Array.isArray(journeys)&&journeys.find(j=>!j.salida);const id=employees[0].id;const r=await db.rpc('registrar_movimiento_personal',{p_empleado_id:id,p_tipo:goingOut?'SALIDA':'ENTRADA',p_observacion:null});if(r.error){showGreeting('No se pudo registrar: '+r.error.message,true);return}if(goingOut){showGreeting('¡Feliz descanso! 😴',true)}else{showGreeting('¡Feliz turno! 👋',false)}await loadAll();updateButton();touch()};startInactivity()}function waitForProfile(){if(isEmployee()){buildEmployee();return}if(typeof profile!=='undefined'&&profile&&profile.rol==='administrador')return;setTimeout(waitForProfile,250)}setTimeout(waitForProfile,500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')touch()});})();<\/script>`;
html=html.replace('</head>',patch+'</head>').replace('</body>',script+'</body>');document.open();document.write(html);document.close();}).catch(e=>{document.getElementById('loading').textContent='No se pudo cargar el Control de Personal: '+e.message});</script></body></html>
