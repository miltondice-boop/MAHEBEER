<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHEBEER - Control de Personal</title><style>html,body{margin:0;height:100%;background:#0b0e11;color:#fff;font-family:Arial,sans-serif}#loading{display:grid;place-items:center;height:100%;font-weight:700}</style></head><body><div id="loading">Cargando MAHEBEER...</div><script>
const BASE='https://raw.githubusercontent.com/miltondice-boop/MAHEBEER/4186f422baeb053df3260287250a23aeea951df5/personal/index.html';
fetch(BASE).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la versión base');return r.text()}).then(html=>{
 const patch=`<style id="employee-patch">
.employee-only-clock{text-align:center!important;padding:28px 12px 35px!important}.employee-only-clock h2{font-size:24px;margin:0 0 8px}.employee-only-clock .sub{color:#9ba5b1;margin-bottom:24px}.employee-round{width:220px;height:220px;border-radius:50%;border:7px solid #f5b942;background:radial-gradient(circle,#2a3036,#11151a 70%);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;box-shadow:0 0 35px #0008;cursor:pointer;transition:.2s}.employee-round:hover{transform:scale(1.03)}.employee-round.out{border-color:#a73e3b}.employee-round .ico{font-size:48px}.employee-round .txt{font-size:20px;font-weight:900}.employee-greeting{margin-top:20px;font-size:22px;font-weight:800;color:#f5b942}.employee-greeting.rest{color:#65e3b0}</style>`;
 const script=`<script>(function(){
 let lastActivity=Date.now(),idleTimer=null,employeeReady=false;
 function touch(){lastActivity=Date.now()}
 ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e,touch,{passive:true}));
 function inactivity(){clearInterval(idleTimer);idleTimer=setInterval(async()=>{if(window.profile&&Date.now()-lastActivity>=300000){clearInterval(idleTimer);try{await window.db.auth.signOut()}catch(e){}alert('Tu sesión se cerró por 5 minutos de inactividad. Debes ingresar nuevamente.');location.reload()}},1000)}
 function isEmployee(){return window.profile&&window.profile.rol!=='administrador'}
 function hideEmployeePrivate(){if(!isEmployee())return;document.querySelector('.stats')?.classList.add('hidden');document.getElementById('adminArea')?.classList.add('hidden');document.getElementById('movementCard')?.classList.add('hidden');const cards=document.querySelectorAll('#app>.card.full');cards.forEach(c=>c.classList.add('hidden'));const area=document.getElementById('employeeArea');if(!area)return;area.className='card employee-only-clock';area.innerHTML='<h2>Mi jornada</h2><div class="sub">Registra tu entrada o salida</div><button id="employeeRound" class="employee-round" type="button"><span class="ico">▶️</span><span class="txt">REGISTRAR ENTRADA</span></button><div id="employeeGreeting"></div>';const open=Array.isArray(window.journeys)&&window.journeys.find(j=>!j.salida);const b=document.getElementById('employeeRound');if(open){b.classList.add('out');b.querySelector('.ico').textContent='⏹️';b.querySelector('.txt').textContent='REGISTRAR SALIDA'}b.onclick=async()=>{if(!window.employees||!window.employees[0])return;const goingOut=Array.isArray(window.journeys)&&window.journeys.find(j=>!j.salida);const id=window.employees[0].id;await window.clock(id,goingOut?'SALIDA':'ENTRADA');const g=document.getElementById('employeeGreeting');if(g){g.className='employee-greeting '+(goingOut?'rest':'');g.textContent=goingOut?'¡Feliz descanso! 😴':'¡Feliz turno! 👋';}setTimeout(()=>{if(g)g.textContent=''},3500)}}
 function watch(){if(isEmployee()){hideEmployeePrivate();inactivity();employeeReady=true}}
 const oldOpen=window.openApp; if(oldOpen){window.openApp=async function(){const r=await oldOpen.apply(this,arguments);setTimeout(watch,50);return r}}
 const oldLoad=window.loadAll; if(oldLoad){window.loadAll=async function(){const r=await oldLoad.apply(this,arguments);setTimeout(watch,30);return r}}
 const oldRender=window.renderSelf; if(oldRender){window.renderSelf=function(){if(isEmployee())hideEmployeePrivate();else oldRender.apply(this,arguments)}}
 setInterval(()=>{if(isEmployee())hideEmployeePrivate()},700);
 setTimeout(()=>{watch();},1000);
})();<\/script>`;
 html=html.replace('</head>',patch+'</head>').replace('</body>',script+'</body>');document.open();document.write(html);document.close();
}).catch(e=>{document.getElementById('loading').textContent='No se pudo cargar el Control de Personal: '+e.message});
</script></body></html>
