<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAHEBEER — Pedir música</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:16px}.card{max-width:620px;margin:30px auto;background:#1c1c1c;border-radius:18px;padding:22px;border:1px solid #333}h1{text-align:center;margin:4px 0 8px;font-size:30px}.subtitle{text-align:center;color:#bbb;margin-bottom:20px}input{width:100%;padding:14px;border-radius:10px;background:#111;color:#fff;border:1px solid #555;font-size:16px}button{border:0;border-radius:11px;font-weight:bold;font-size:16px;cursor:pointer;padding:14px;width:100%}.enter,.music{background:#d99a16;color:#111;margin-top:12px}.catalog{display:block;text-align:center;background:#292929;color:#fff;text-decoration:none;border-radius:11px;padding:13px;margin-top:10px;font-weight:bold}.screen{display:none}.name-box{margin-top:25px}.welcome{text-align:center;color:#ddd;margin:5px 0 18px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:9px}.row input{min-width:0}.remove{width:44px;padding:0;background:#3a3030;color:#fff;font-size:20px}.add{background:#333;color:#fff;margin-top:3px}.msg{text-align:center;margin-top:14px;min-height:22px;font-weight:bold}.hint{text-align:center;color:#999;font-size:13px;margin-top:12px}@media(max-width:480px){.row{grid-template-columns:1fr 1fr 42px}.card{margin:10px auto;padding:18px}}
</style>
</head>
<body>
<div class="card">
<h1>🎸 MAHEBEER</h1>
<div id="nameScreen">
<div class="subtitle">Bienvenido. Escribe tu nombre para continuar.</div>
<div class="name-box"><input id="customerName" autocomplete="name" placeholder="Tu nombre"></div>
<button class="enter" onclick="enter()">ENTRAR</button>
<div id="nameMsg" class="msg"></div>
</div>
<div id="musicScreen" class="screen">
<div id="welcome" class="welcome"></div>
<div class="subtitle">Agrega todas las canciones que quieras pedir.</div>
<div id="songs"></div>
<button class="add" onclick="addSong()">➕ AGREGAR OTRA CANCIÓN</button>
<button class="music" onclick="submitMusic()">🎵 PEDIR MÚSICA</button>
<a class="catalog" href="https://wa.me/c/573022092356" target="_blank" rel="noopener">🍔 MENÚ DE COMIDAS 😋</a>
<div class="hint">Puedes agregar varias canciones antes de enviar.</div>
<div id="msg" class="msg"></div>
</div>
</div>
<script>
const API='https://gkuwjfmgdmlyqgmvdmzf.supabase.co/functions/v1/mahebeer-service-requests';let songs=[];
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function enter(){const name=document.getElementById('customerName').value.trim();if(!name){document.getElementById('nameMsg').textContent='⚠️ Escribe tu nombre para continuar.';return}sessionStorage.setItem('mahebeer_customer_name',name);document.getElementById('nameScreen').style.display='none';document.getElementById('musicScreen').style.display='block';document.getElementById('welcome').textContent='Hola, '+name+' 👋';if(!songs.length)addSong()}
function addSong(){songs.push({id:Date.now()+Math.random(),title:'',artist:''});renderSongs()}
function removeSong(id){if(songs.length===1)return;songs=songs.filter(s=>s.id!==id);renderSongs()}
function renderSongs(){document.getElementById('songs').innerHTML=songs.map((s,i)=>'<div class="row"><input placeholder="Canción '+(i+1)+'" value="'+escapeHtml(s.title)+'" oninput="songs.find(x=>x.id==='+s.id+').title=this.value"><input placeholder="Artista (opcional)" value="'+escapeHtml(s.artist)+'" oninput="songs.find(x=>x.id==='+s.id+').artist=this.value"><button class="remove" onclick="removeSong('+s.id+')">×</button></div>').join('')}
async function submitMusic(){const valid=songs.filter(s=>s.title.trim());if(!valid.length){document.getElementById('msg').textContent='⚠️ Escribe al menos una canción.';return}const customer=document.getElementById('customerName').value.trim()||sessionStorage.getItem('mahebeer_customer_name')||'';const text=valid.map((s,i)=>(i+1)+'. '+s.title.trim()+(s.artist.trim()?' — '+s.artist.trim():'')).join('\n');const payload={request_type:'musica',table_token:'GENERAL',table_name:'GENERAL',customer_name:customer,request_text:'PEDIDO DE MÚSICA\n'+text,source:'qr_general'};const msg=document.getElementById('msg');msg.textContent='ENVIANDO...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo enviar');msg.textContent='✅ MÚSICA SOLICITADA';songs=[{id:Date.now(),title:'',artist:''}];renderSongs()}catch(e){msg.textContent='❌ '+e.message}}
document.getElementById('customerName').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
</script>
</body>
</html>
