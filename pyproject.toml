[project]
name = "mahebeer-recetas-costos"
version = "1.0.0"
description = "Aplicación de escritorio MAHEBEER - Recetas y Costos"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "openpyxl>=3.1",
  "reportlab>=4.2"
]

[project.scripts]
mahebeer = "mahebeer.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
